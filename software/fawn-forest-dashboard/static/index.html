<!doctype html>
<html lang="en" data-theme="jarvis">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fawn Forest Investments - paper desk</title>
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="demo-banner" class="demo-banner" hidden>DEMO DATA. FICTIONAL NUMBERS. NOT A RESULT. NOT REAL MONEY.</div>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <div class="eyebrow" id="eyebrow">Trading department</div>
      <h1>FAWN FOREST INVESTMENTS</h1>
    </div>
  </div>
  <div class="top-right">
    <div class="paper-badge" title="No real order is ever placed from here">PAPER ONLY</div>
    <div class="theme-sw" role="group" aria-label="Look">
      <button data-theme-btn="jarvis" class="on">JARVIS</button>
      <button data-theme-btn="ares">ARES</button>
    </div>
    <div class="seg" role="group" aria-label="Data source">
      <button data-src="auto" class="on">AUTO</button>
      <button data-src="live">LIVE</button>
      <button data-src="demo">DEMO</button>
    </div>
  </div>
</header>

<div id="statusline" class="statusline"></div>
<section id="fresh" class="strip"></section>

<main id="app" class="grid">
  <section class="card span2" id="c-week"></section>
  <section class="card span2" id="c-regime"></section>
  <section class="card span4" id="c-chart"></section>
  <section class="card span2" id="c-main"></section>
  <section class="card span2" id="c-zac"></section>
  <section class="card span4" id="c-haircut"></section>
  <section class="card span4" id="c-heat"></section>
  <section class="card span2" id="c-check"></section>
  <section class="card span2" id="c-trades"></section>
  <section class="card span2" id="c-crypto"></section>
  <section class="card span2" id="c-insider"></section>
</main>
<footer class="foot">Read-only. Shows files only. No order buttons, no keys, no outside network. Nothing here is financial advice and no result is a promise.</footer>
<script src="/app.js"></script>
</body>
</html>
