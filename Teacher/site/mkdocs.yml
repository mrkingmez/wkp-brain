site_name: Teacher
site_description: A private home course on using AI the right way.
docs_dir: docs
site_dir: build
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.sections
    - content.code.copy
extra_css:
  - assets/teacher.css
extra_javascript:
  - assets/course.js
  - assets/unlock.js
  - assets/quizzes.js
  - assets/quiz.js
  - assets/practice.js
markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Home: index.md
  - "1. Is it right?":
      - module-1/index.md
      - "How to check what AI tells you": module-1/lesson-1.md
  - "2. Privacy": module-2/index.md
  - "3. Scams and fakes": module-3/index.md
  - "4. When not to use AI": module-4/index.md
  - "5. Advanced track": module-5/index.md
