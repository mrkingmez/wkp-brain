site_name: Teacher
site_description: A private home course on using AI the right way.
docs_dir: docs
site_dir: build
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
extra_css:
  - assets/teacher.css
extra_javascript:
  - assets/course.js
  - assets/unlock.js
  - assets/quizzes.js
  - assets/quiz.js
  - assets/practice.js
markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Home: index.md
  - "1. Start Here": start-here/index.md
  - "2. Make Things": make-things/index.md
  - "3. Build and Automate":
      - build-automate/index.md
      - "Advanced doorway": build-automate/advanced.md
  - "4. Stay Safe":
      - stay-safe/index.md
      - "How to check what AI tells you": stay-safe/check-what-ai-tells-you.md
      - "Privacy (not written yet)": stay-safe/privacy.md
      - "Scams and fakes (not written yet)": stay-safe/scams.md
      - "When not to use AI (not written yet)": stay-safe/when-not-to-use.md
